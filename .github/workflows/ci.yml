name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cowrie-image:
    name: Build Cowrie Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker compose build
        working-directory: honeypots/cowrie
        run: docker compose build

  python:
    name: Lambdas, demo backend + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (editor parity)
        run: pip install -r pipeline/ingest_lambda/requirements.txt

      - name: Byte-compile Lambdas and demo backend
        run: python -m compileall -q pipeline demo honeypots/cowrie ml tests

      - name: Unit tests (stdlib only — exercises the pure-Python DBSCAN path)
        run: python -m unittest discover -s tests -v

      - name: Demo backend snapshot export
        run: python demo/server.py --export-snapshot /tmp/snapshot.json

      - name: Install script deps and byte-compile uploader
        run: |
          pip install -r scripts/requirements.txt
          python -m compileall -q scripts

  dashboard:
    name: Build React dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

  ml-cluster:
    name: ML clustering stub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML deps
        run: pip install -r ml/requirements.txt

      - name: Run DBSCAN stub on fixture
        run: python ml/cluster_events.py --input pipeline/fixtures/sample_cowrie_lines.jsonl --output ml/out-ci-labeled.jsonl
