name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cowrie-image:
    name: Build Cowrie Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker compose build
        working-directory: honeypots/cowrie
        run: docker compose build

  ingest-lambda:
    name: Python ingest Lambda (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (editor parity)
        run: pip install -r pipeline/ingest_lambda/requirements.txt

      - name: Byte-compile handler
        run: python -m compileall -q pipeline/ingest_lambda

      - name: Install script deps and byte-compile uploader
        run: |
          pip install -r scripts/requirements.txt
          python -m compileall -q scripts
